name: Python CI/CD

permissions:
  contents: write
  id-token: write

on:
  workflow_call:
    inputs:
      coverage-python-version:
        description: "Python version for which coverage is uploaded; must be in python-versions"
        required: false
        type: string
        default: "3.15"
      default-python-version:
        description: "Python version for non-matrix jobs (cqa, docs, publish)"
        required: false
        type: string
        default: "3.15"
      publish:
        description: 'Set to "true" to publish the package and docs'
        required: false
        type: boolean
        default: false
      python-versions:
        description: "JSON list of Python versions to test"
        required: false
        type: string
        default: '["3.11", "3.12", "3.13", "3.14", "3.15"]'
    secrets:
      pypi-token:
        description: "PyPI API Token for publishing"
        required: false

jobs:
  cqa:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/.cache/prek
          key: prek-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up uv and Python ${{ inputs.default-python-version }}
        uses: astral-sh/setup-uv@v10.3.2
        with:
          cache-suffix: ${{ inputs.default-python-version }}
          enable-cache: true
          python-version: ${{ inputs.default-python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run code quality assessments
        run: make cqa

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    strategy:
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
      fail-fast: false

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          if [ -f .github/system-dependencies.txt ]; then
            sudo apt-get update
            xargs sudo apt-get install -y < .github/system-dependencies.txt
          fi

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.3.2
        with:
          cache-suffix: ${{ matrix.python-version }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: make ${{ matrix.python-version == inputs.coverage-python-version && 'test-coverage' || 'test' }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ matrix.python-version == inputs.coverage-python-version }}
        with:
          fail_ci_if_error: true
          files: coverage.xml
          use_oidc: true

  check-docs:
    name: Check Docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up uv and Python ${{ inputs.default-python-version }}
        uses: astral-sh/setup-uv@v10.3.2
        with:
          cache-suffix: ${{ inputs.default-python-version }}
          enable-cache: true
          python-version: ${{ inputs.default-python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Check if documentation can be built
        run: make docs-test

  # Single stable check for branch protection; matrix changes need no protection updates.
  # if: always() is required: a skipped required check counts as passing.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [cqa, test, check-docs]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail unless all required jobs succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

  publish-package:
    name: Publish Package
    needs: ci-ok  # publish gated by the same aggregate check as merges
    if: ${{ inputs.publish == true }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up uv and Python ${{ inputs.default-python-version }}
        uses: astral-sh/setup-uv@v10.3.2
        with:
          cache-suffix: ${{ inputs.default-python-version }}
          enable-cache: true
          python-version: ${{ inputs.default-python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Build and publish package to PyPI
        run: make publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.pypi-token }}

  deploy-docs:
    name: Publish Docs
    needs: publish-package
    if: ${{ inputs.publish == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up uv and Python ${{ inputs.default-python-version }}
        uses: astral-sh/setup-uv@v10.3.2
        with:
          cache-suffix: ${{ inputs.default-python-version }}
          enable-cache: true
          python-version: ${{ inputs.default-python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Deploy documentation
        run: make docs-deploy
