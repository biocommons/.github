name: Python CI/CD

permissions:
  contents: write
  id-token: write

on:
  workflow_call:
    inputs:
      publish:
        description: 'Set to "true" to publish the package and docs'
        required: false
        type: boolean
        default: false
      python-versions:
        description: "JSON list of Python versions to test"
        required: false
        type: string
        default: '["3.11", "3.12", "3.13", "3.14", "3.15"]'
      coverage-python-version:
        description: "Python version for which coverage is uploaded; must be in python-versions"
        required: false
        type: string
        default: "3.15"
    secrets:
      pypi-token:
        description: "PyPI API Token for publishing"
        required: false

jobs:
  cqa:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pre-commit
          key: pydeps-${{ hashFiles('.pre-commit-config.yaml', 'pyproject.toml') }}

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Run code quality assessments
        run: make cqa
  
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    strategy:
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
      fail-fast: false

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          if [ -f .github/system-dependencies.txt ]; then
            sudo apt-get update
            xargs sudo apt-get install -y < .github/system-dependencies.txt
          fi

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pydeps-${{ hashFiles('.pre-commit-config.yaml', 'pyproject.toml') }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run make test
        run: make test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ matrix.python-version == inputs.coverage-python-version }}
        with:
          use_oidc: true

  check-docs:
    name: Check Docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Check if documentation can be built
        run: uv run mkdocs build -s

  publish-package:
    name: Publish Package
    needs: [cqa, test, check-docs]
    if: ${{ inputs.publish == true }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pydeps-${{ hashFiles('.pre-commit-config.yaml', 'pyproject.toml') }}

      - name: Set up Python
        uses: ./.github/actions/setup-python-env

      - name: Build sdist and wheel with uv
        run: |
          uv build

      - name: Publish package to PyPI
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.pypi-token }}

  deploy-docs:
    name: Publish Docs
    needs: publish-package
    if: ${{ inputs.publish == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pydeps-${{ hashFiles('.pre-commit-config.yaml', 'pyproject.toml') }}

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Deploy documentation
        run: uv run mkdocs gh-deploy --force
